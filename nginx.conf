server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # nginx drops server-level add_header lines in any location that sets its own,
    # so the security headers live in one include that every location repeats.
    include /etc/nginx/snippets/security-headers.conf;

    # Never serve dotfiles (.DS_Store, .env, .git ...)
    location ~ /\. {
        access_log off;
        return 404;
    }

    # Vite hashes every file under /assets, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must never be cached, or users keep loading old bundles after a deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Client-side routing (react-router): unknown paths fall back to the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Included by every location in nginx.conf (add_header is not inherited once a location sets its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers ignore HSTS over plain http, so this only takes effect behind an https front end.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The admin app uses none of these browser features.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
